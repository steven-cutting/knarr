name: Set up repository tools
description: Install the locked pixi environment and initialize repository dependencies
inputs:
  cluster:
    description: Install the optional cluster environment
    default: "false"
    required: false
  audit:
    description: Install the optional audit environment (grype)
    default: "false"
    required: false
runs:
  using: composite
  steps:
    - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
      with:
        pixi-version: v0.81.0
        locked: true
        # setup-pixi appends the platform and SHA-256 of pixi.lock to this key.
        cache-key: knarr-pixi-v0.81.0-
        cache: true
        cache-write: ${{ github.ref == 'refs/heads/main' }}
        activate-environment: true
    - run: just initialize
      shell: bash
    - if: inputs.cluster == 'true'
      run: just cluster-install
      shell: bash
    - if: inputs.audit == 'true'
      run: just audit-install
      shell: bash
