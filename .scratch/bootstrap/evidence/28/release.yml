# Ticket 28: the drafted release workflow, under evidence on purpose. Under
# .github/workflows/ it would run on the next v* tag with packages: write;
# ticket 36 moves it there once the guards it sources live in scripts/release/
# (from ../lib.sh) and CHANGELOG.md exists (ticket 12). actionlint.sh lints it
# here. Authorization required: every run of this workflow pushes to ghcr.io.
#
# The release model (Decision 0011): the maintainer merges a release pull
# request that bumps gleam.toml and CHANGELOG.md, tags the merge commit
# vX.Y.Z and pushes the tag. This workflow verifies the tag, waits for the
# maintainer's approval through the release environment, and pushes the image
# tags X.Y.Z, X.Y and sha-<7> (and X for a major above 0; never latest). It
# refuses to push over a tag that exists, so a release is published once.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/steven-cutting/knarr

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.guards.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The ancestry guard needs origin/main and the tag's full history.
          fetch-depth: 0
      - name: Tag, version, ancestry and changelog guards
        id: guards
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Ticket 36 moves .scratch/bootstrap/evidence/28/lib.sh here.
          # shellcheck source=/dev/null
          . scripts/release/lib.sh
          version=$(toml_version < gleam.toml)
          if ! tag_matches_version "$TAG" "$version"; then
            echo "::error::tag $TAG does not match gleam.toml version $version"; exit 1
          fi
          verdict=$(ancestor_verdict "refs/tags/$TAG" origin/main) || {
            echo "::error::tag $TAG is $verdict of origin/main: release only what main carries"; exit 1
          }
          if ! changelog_has_version "$version" < CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' heading"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag $TAG: version $version, an ancestor of origin/main, in the changelog"

  publish:
    name: Publish to ghcr.io
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Authorization required: the release environment carries a required
    # reviewer, so the run waits here for the maintainer's approval before
    # this job gets a token. GitHub creates a referenced environment with no
    # protection rules if it does not exist, so ticket 36 creates it, with the
    # maintainer as reviewer and "Prevent self-review" off, before this file
    # is merged; ticket 37 only confirms it.
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to ghcr.io
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Refuse to push over an existing tag
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # shellcheck source=/dev/null
          . scripts/release/lib.sh
          repo=${IMAGE#ghcr.io/}
          # The same token exchange docker push makes; a push scope is granted
          # for a package that does not exist yet, so the first release sees
          # 404 (absent). Anything but absent stops the job: unknown is never
          # read as absent (ghcr-probe.txt, registry.txt).
          bearer=$(curl -sSf -u "$ACTOR:$TOKEN" "https://ghcr.io/token?scope=repository:$repo:pull,push&service=ghcr.io" |
            perl -ne 'print $1 if /"token":"([^"]+)"/')
          probe_tag https://ghcr.io "$repo" "$VERSION" -H "Authorization: Bearer $bearer"
          case $verdict in
            absent) echo "$IMAGE:$VERSION is absent (http $code): pushing" ;;
            present) echo "::error::$IMAGE:$VERSION exists (http $code): a release is published once; bump the version"; exit 1 ;;
            *) echo "::error::cannot tell whether $IMAGE:$VERSION exists (http $code, curl $curl_rc): not pushing"; exit 1 ;;
          esac
      - name: Build and push linux/amd64
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # shellcheck source=/dev/null
          . scripts/release/lib.sh
          sha=$(git rev-parse "refs/tags/$TAG^{commit}")
          set --
          for t in $(tags_for "$TAG" "$sha"); do set -- "$@" --tag "$IMAGE:$t"; done
          # --provenance=false --sbom=false: one image manifest, whose digest
          # is the one the overlay pins, whatever image store the runner's
          # docker has (registry.txt). Ticket 38 turns attestations on and
          # pins the index digest instead.
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/steven-cutting/knarr" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$sha" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --metadata-file metadata.json "$@" --push .
          digest=$(digest_of_metadata < metadata.json)
          {
            echo "## Published $IMAGE"
            echo
            echo "Pin this in deploy/release: \`$IMAGE@$digest\`"
            echo
            for t in $(tags_for "$TAG" "$sha"); do echo "- \`$IMAGE:$t\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "digest=$digest"
      # Ticket 38 adds, with id-token: write and attestations: write on this job:
      #   - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      #     with:
      #       subject-name: ghcr.io/steven-cutting/knarr
      #       subject-digest: ${{ env.DIGEST }}
      #       push-to-registry: true
      # and verifies with: gh attestation verify oci://ghcr.io/steven-cutting/knarr@<digest> --repo steven-cutting/knarr
